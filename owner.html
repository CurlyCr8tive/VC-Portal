<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verified Consulting — Owner Dashboard</title>
  <link rel="stylesheet" href="portal-styles.css?v=20260922-clients-table" />
</head>
<body>
  <div class="client-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="client-sidebar" id="owner-sidebar" aria-label="Owner dashboard navigation sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark" aria-hidden="true">V</span>
        <span class="brand-name">Verified Consulting</span>
      </div>
      <div class="sidebar-client-name">
        Owner dashboard
        <strong>Loading...</strong>
      </div>
    </aside>

    <main class="client-main">
      <header class="client-header" id="owner-header">
        <div>
          <h1>Loading owner portal...</h1>
          <p class="header-sub">If this stays here, refresh the page once.</p>
        </div>
      </header>

      <div id="view-dashboard" class="client-view active">
        <div id="dashboard-content"></div>
      </div>

      <div id="view-clients" class="client-view">
        <div id="clients-content"></div>
      </div>

      <div id="view-campaigns" class="client-view">
        <div id="campaigns-content"></div>
      </div>

      <div id="view-campaign-detail" class="client-view">
        <div id="campaign-detail-content"></div>
      </div>

      <div id="view-placements" class="client-view">
        <div id="placements-content"></div>
      </div>

      <div id="view-reviewqueue" class="client-view">
        <div id="reviewqueue-content"></div>
      </div>

      <div id="view-reports" class="client-view">
        <div id="reports-content"></div>
      </div>

      <div id="view-analytics" class="client-view">
        <div id="analytics-content"></div>
      </div>

      <div id="view-coaching" class="client-view">
        <div id="coaching-content"></div>
      </div>

      <div id="view-settings" class="client-view">
        <div id="settings-content"></div>
      </div>
    </main>
  </div>

  <script src="src/supabaseConfig.js"></script>
  <script>
    window.addEventListener("error", (event) => {
      const sidebar = document.getElementById("owner-sidebar");
      const header = document.getElementById("owner-header");
      if (!sidebar || !header || sidebar.querySelector("[data-nav]")) return;
      const detail = event.error?.stack || event.message || "No browser error details were provided.";
      sidebar.innerHTML = `
        <div class="sidebar-brand">
          <span class="logo-mark" aria-hidden="true">V</span>
          <span class="brand-name">Verified Consulting</span>
        </div>
        <div class="sidebar-client-name">
          Owner dashboard
          <strong>App did not finish loading</strong>
        </div>
      `;
      header.innerHTML = `
        <div>
          <h1>Owner portal needs a refresh</h1>
          <p class="header-sub">The dashboard script did not load cleanly. Refresh this page, then sign in again if prompted.</p>
          <pre style="white-space:pre-wrap; max-width:900px; margin-top:16px; padding:14px; border:1px solid #ead8cf; border-radius:8px; background:#fff7f2; color:#7a3e2d; font-size:0.85rem; line-height:1.4;">${String(detail).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]))}</pre>
        </div>
      `;
    }, true);
  </script>
  <script type="module" src="src/owner/app.js?v=20260922-coaching-actions"></script>
</body>
</html>
